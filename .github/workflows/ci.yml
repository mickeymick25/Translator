# CI Pipeline — IMP2-T003 (v2.0)
# Déclenché sur push main/develop + PR vers main/develop
# Actions : lint (ruff check + ruff format) + tests (pytest) + build Docker (vérification)

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check translator/

      - name: Run ruff format check
        run: ruff format --check translator/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r translator/requirements.txt
          pip install -r translator/requirements-dev.txt

      - name: Run tests
        working-directory: translator
        run: pytest tests/ -v --tb=short --cov=core --cov=modes --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t translator-test translator/

      - name: Run smoke test
        run: docker run --rm --entrypoint python translator-test -c "from core.translator import get_provider; print('OK')"
