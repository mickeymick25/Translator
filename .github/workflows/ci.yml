# CI Pipeline — IMP-T002 (optionnel)
# Déclenché sur push main/develop + PR vers main/develop
# Actions : lint (ruff, black) + tests (pytest) + build Docker (vérification)

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lint dependencies
        run: |
          pip install ruff black
          pip install -r translator/requirements.txt

      - name: Run linting (ruff)
        run: ruff check translator/

      - name: Run black check
        run: black --check translator/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r translator/requirements.txt

      - name: Install test dependencies
        run: pip install pytest pytest-cov pytest-mock

      - name: Run tests
        run: pytest translator/tests/ -v --cov=translator --cov-report=xml

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t translator-test translator/

      - name: Run smoke test
        run: docker run --rm translator-test python -c "from core import translator; print('OK')"
