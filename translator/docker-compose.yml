version: "3.8"

services:
  translator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cop_translator
    volumes:
      - ./output:/app/output
      - ./source:/app/source
      - ./output/excel:/app/excel
      - ../Doc:/app/doc
    environment:
      - PYTHONUNBUFFERED=1
      - MODE=${MODE:-translate-json}
      - SOURCE_LANG=${SOURCE_LANG:-en}
      - TARGET_LANG=${TARGET_LANG:-cs}
      - SOURCE_FILE=${SOURCE_FILE:-}
      - OUTPUT_DIR=${OUTPUT_DIR:-/app/output}
      - EXCEL_DIR=${EXCEL_DIR:-/app/excel}
      - DOC_DIR=${DOC_DIR:-/app/doc}
      - SOURCE_DIR=${SOURCE_DIR:-/app/source}
      - BATCH_LANGS=${BATCH_LANGS:-en,fr,cz,sk,de,it,ar}
      - OUTPUT_FORMAT=${OUTPUT_FORMAT:-auto}
      - TRANSLATION_PROVIDER=${TRANSLATION_PROVIDER:-google}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - DEEPL_USE_FREE_API=${DEEPL_USE_FREE_API:-true}
      - TRANSLATION_FALLBACK=${TRANSLATION_FALLBACK:-false}
    working_dir: /app

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cop_translator_test
    entrypoint: ["python", "-m", "pytest"]
    command:
      [
        "tests/",
        "-v",
        "--tb=short",
        "--cov=core",
        "--cov=modes",
        "--cov-report=term-missing",
      ]
    environment:
      - PYTHONUNBUFFERED=1
      - SOURCE_DIR=/app/source
      - OUTPUT_DIR=/app/output
      - EXCEL_DIR=/app/excel
      - DOC_DIR=/app/doc
    working_dir: /app

  lint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cop_translator_lint
    entrypoint: ["bash", "-c"]
    command: ["ruff check . && ruff format --check ."]
    volumes:
      - ./core:/app/core
      - ./modes:/app/modes
      - ./service.py:/app/service.py
      - ./tests:/app/tests
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  output:
